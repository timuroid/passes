<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Отправка номера автомобиля для оформления пропуска ЗТЗ">
  <title>Пропуск ЗТЗ</title>
  <script src="/assets/js/theme.js?v=20260825-2"></script>
  <link rel="stylesheet" href="/assets/css/styles.css?v=20260825-3">
  <script src="/assets/js/i18n.js?v=20260825-2" defer></script>
  <script src="/assets/js/api.js?v=20260825-2" defer></script>
  <script src="/assets/js/public.js?v=20260825-2" defer></script>
</head>
<body class="public-page">
  <header class="site-header container">
    <a class="brand" href="/" aria-label="Загорский трубный завод, ГК «Уральская сталь»">
      <img class="brand-symbol" src="/assets/brand/ztz-symbol.svg" alt="">
      <span class="brand-wordmark"><span>Загорский<br>трубный<br>завод</span><small>ГК «Уральская сталь»</small></span>
      <span class="brand-copy" data-i18n="brandService">Сервис пропусков</span>
    </a>
    <div class="header-actions">
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Тёмная тема"><span aria-hidden="true">◐</span></button>
      <label class="sr-only" for="language-select" data-i18n="language">Язык</label>
      <select id="language-select" class="language-select" aria-label="Язык" data-i18n-aria-label="language">
        <option value="ru">Русский</option>
        <option value="tg">Тоҷикӣ</option>
      </select>
      <a class="text-link" href="/login" data-i18n="employeeLogin">Вход для сотрудников</a>
    </div>
  </header>

  <main class="public-main container">
    <section class="hero-card">
      <div class="eyebrow" data-i18n="driverEyebrow">Водителям</div>
      <h1 data-i18n="driverTitle">Введите номер</h1>
      <form id="pass-form" class="pass-form" novalidate>
        <label class="sr-only" for="vehicle-number" data-i18n="vehicleLabel">Номер автомобиля</label>
        <input id="vehicle-number" name="vehicle_number" type="text" minlength="2" maxlength="24"
               autocomplete="off" autocapitalize="characters" spellcheck="false"
               data-i18n-placeholder="vehiclePlaceholder" placeholder="А 123 ВС 77" required>
        <label class="sr-only" for="phone-number" data-i18n="phoneLabel">Номер телефона</label>
        <input id="phone-number" name="phone_number" type="tel" maxlength="40" inputmode="tel" autocomplete="tel"
               data-i18n-placeholder="phonePlaceholder" placeholder="+7 999 123-45-67" required>
        <button id="submit-button" class="button button-primary" type="submit" data-i18n="send">Отправить</button>
        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
      </form>
    </section>

    <aside class="qr-card">
      <div>
        <div class="eyebrow" data-i18n="qrEyebrow">Быстрый доступ</div>
        <h2 data-i18n="qrTitle">QR-код страницы</h2>
        <p data-i18n="qrLead">Распечатайте код или откройте его на другом устройстве.</p>
        <button id="copy-link" class="button button-secondary" type="button" data-i18n="copyLink">Скопировать ссылку</button>
        <span id="copy-status" class="copy-status" role="status"></span>
      </div>
      <img class="qr-image" src="/api/public/driver-qr.svg" alt="QR-код страницы водителя" data-i18n-alt="qrAlt">
    </aside>
  </main>

</body>
</html>
