<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Отправка номера автомобиля для оформления пропуска ЗТЗ">
  <title>Терминал ЗТЗ</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=20260827-4">
  <script src="/assets/js/public-theme.js?v=20260827-1" defer></script>
  <script src="/assets/js/i18n.js?v=20260827-3" defer></script>
  <script src="/assets/js/api.js?v=20260825-2" defer></script>
  <script src="/assets/js/public.js?v=20260827-4" defer></script>
</head>
<body class="public-page kiosk-page">
  <header class="site-header container">
    <div class="brand" aria-label="Загорский трубный завод, ГК «Уральская сталь»">
      <img class="brand-symbol" src="/assets/brand/ztz-symbol.svg" alt="">
      <span class="brand-wordmark"><span>Загорский<br>трубный<br>завод</span><small>ГК «Уральская сталь»</small></span>
    </div>
    <div class="kiosk-language-switch" role="group" aria-label="Язык" data-i18n-aria-label="language">
      <button type="button" data-language="ru">Русский</button>
      <button type="button" data-language="tg">Тоҷикӣ</button>
      <button type="button" data-language="uz">O‘zbekcha</button>
      <button type="button" data-language="kk">Қазақша</button>
      <button type="button" data-language="ky">Кыргызча</button>
      <button type="button" data-language="az">Azərbaycanca</button>
    </div>
  </header>

  <main class="public-main container">
    <section class="hero-card">
      <div class="eyebrow" data-i18n="driverEyebrow">Водителям</div>
      <h1 data-i18n="driverTitle">Введите номер</h1>
      <form id="pass-form" class="pass-form" novalidate>
        <div class="kiosk-fields">
          <span id="vehicle-number-label" class="sr-only" data-i18n="vehicleLabel">Номер автомобиля</span>
          <div id="vehicle-number" class="kiosk-input" role="textbox" tabindex="0" aria-labelledby="vehicle-number-label"
               aria-multiline="false" data-i18n-placeholder="vehiclePlaceholder" data-placeholder="A123BC77"></div>
          <span id="phone-number-label" class="sr-only" data-i18n="phoneLabel">Номер телефона</span>
          <div id="phone-number" class="kiosk-input" role="textbox" tabindex="0" aria-labelledby="phone-number-label"
               aria-multiline="false" data-i18n-placeholder="phonePlaceholder" data-placeholder="+7 999 123-45-67"></div>
          <button id="submit-button" class="button button-primary" type="submit" data-i18n="send">Отправить</button>
        </div>
        <section class="onscreen-keyboard" aria-labelledby="keyboard-title">
          <div class="keyboard-heading">
            <strong id="keyboard-title" data-i18n="vehicleKeyboard">Клавиатура номера</strong>
            <span data-i18n="touchHint">Коснитесь поля, затем используйте кнопки</span>
          </div>
          <div id="vehicle-keyboard" class="keyboard-vehicle">
            <div class="keyboard-grid keyboard-digits">
              <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button>
              <button type="button" data-key="6">6</button><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="0">0</button>
            </div>
            <div class="keyboard-grid keyboard-letters">
              <button type="button" data-key="A">A</button><button type="button" data-key="B">B</button><button type="button" data-key="C">C</button><button type="button" data-key="D">D</button><button type="button" data-key="E">E</button><button type="button" data-key="F">F</button><button type="button" data-key="G">G</button><button type="button" data-key="H">H</button><button type="button" data-key="I">I</button><button type="button" data-key="J">J</button>
              <button type="button" data-key="K">K</button><button type="button" data-key="L">L</button><button type="button" data-key="M">M</button><button type="button" data-key="N">N</button><button type="button" data-key="O">O</button><button type="button" data-key="P">P</button><button type="button" data-key="Q">Q</button><button type="button" data-key="R">R</button><button type="button" data-key="S">S</button><button type="button" data-key="T">T</button>
              <button type="button" data-key="U">U</button><button type="button" data-key="V">V</button><button type="button" data-key="W">W</button><button type="button" data-key="X">X</button><button type="button" data-key="Y">Y</button><button type="button" data-key="Z">Z</button>
            </div>
            <button class="keyboard-delete" type="button" data-action="backspace" data-i18n-aria-label="backspace" aria-label="Удалить символ">⌫</button>
          </div>
          <div id="phone-keyboard" class="keyboard-grid keyboard-phone hidden">
            <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
            <button type="button" data-key="+">+</button><button type="button" data-key="0">0</button><button type="button" data-action="backspace" data-i18n-aria-label="backspace" aria-label="Удалить символ">⌫</button>
          </div>
        </section>
        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

</body>
</html>
